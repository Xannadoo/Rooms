<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Rooms">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="apple-touch-icon.png">
<title>Room tracker</title>
<style>
:root{--bg:#fff;--s:#f3f2ee;--t:#1c1c1a;--m:#6b6a64;--l:#dcdad3;--g:#2d6a3a;--gb:#e1f0de;--a:#7a4f08;--ab:#faebcc;--r:#9b2626;--rb:#fbe1e1;--ac:#185fa5;--acb:#e3eefa;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#1b1b19;--s:#272725;--t:#ecebe6;--m:#a3a199;--l:#3a3a37;--g:#8fd09b;--gb:#1f3a25;--a:#f0c070;--ab:#3d2e0f;--r:#f09a9a;--rb:#401c1c;--ac:#85b7eb;--acb:#14293f;color-scheme:dark}}
:root[data-theme=dark]{--bg:#1b1b19;--s:#272725;--t:#ecebe6;--m:#a3a199;--l:#3a3a37;--g:#8fd09b;--gb:#1f3a25;--a:#f0c070;--ab:#3d2e0f;--r:#f09a9a;--rb:#401c1c;--ac:#85b7eb;--acb:#14293f;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--t);font:16px/1.4 -apple-system,system-ui,"Segoe UI",sans-serif;padding-bottom:72px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:9;padding:10px 14px;border-bottom:1px solid var(--l);display:flex;align-items:center;gap:10px;font-weight:500;font-size:18px}
button{font:inherit;color:var(--t)}
.chips{display:flex;gap:6px;padding:8px 14px;flex-wrap:wrap}
.chip{font-size:13px;padding:6px 12px;border-radius:99px;border:1px solid var(--l);background:none;color:var(--m)}
.chip.on{background:var(--acb);color:var(--ac);border-color:var(--ac)}
.row{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--l);min-height:56px}
.pin{background:var(--s)}
.sp{flex:1;min-width:0}
.sub{font-size:13px;color:var(--m)}
.lk{text-decoration:underline;cursor:pointer}
.bd{font-size:13px;padding:3px 8px;border-radius:6px;white-space:nowrap}
.g{background:var(--gb);color:var(--g)}.a{background:var(--ab);color:var(--a)}.r{background:var(--rb);color:var(--r)}.n{background:var(--s);color:var(--m)}
.btn{min-height:44px;min-width:76px;padding:0 14px;border-radius:8px;border:1px solid var(--m);background:var(--bg)}
.btn.u{color:var(--m);border-color:var(--l)}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--bg);border-top:1px solid var(--l);padding-bottom:env(safe-area-inset-bottom,0px);z-index:9}
nav button{flex:1;padding:14px 0;border:0;background:none;font-size:14px;color:var(--m)}
nav button.on{color:var(--ac);font-weight:500}
input,textarea{font:inherit;color:var(--t);background:var(--bg);border:1px solid var(--m);border-radius:8px;padding:8px;width:100%}
textarea{min-height:130px}
.pad{padding:10px 14px}
.note{padding:10px 14px;border-bottom:1px solid var(--l);display:flex;gap:10px;align-items:center}
label{display:block;font-size:13px;color:var(--m);margin:12px 0 4px}
</style></head><body>
<div id="app"></div>
<script>
const K='roomtracker1';
let S,V={v:'home',l:null,sort:'age',nf:'open',x:null,dl:null,msg:''};
const $=s=>document.getElementById(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const dayOf=t=>{const d=new Date(t);return new Date(d.getFullYear(),d.getMonth(),d.getDate()).getTime()};
const ago=t=>Math.round((dayOf(Date.now())-dayOf(t))/864e5);
const pad=n=>String(n).padStart(2,'0');
const fd=t=>{const d=new Date(t);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const ftm=t=>{const d=new Date(t);return pad(d.getHours())+':'+pad(d.getMinutes())};
function def(){const rooms=[];['04','05'].forEach(f=>{for(let n=30;n<=49;n++)if(n!=46&&n!=48)rooms.push(f+n)});
return{rooms,floors:['Floor 4','Floor 5'],
rt:['Dust sink pipe','Dust all closet area','Dust door pump','Dust ventilation','Hairdryer status check','Correct pillows and duvet check','Clean mattress protector check','Vacuum carpet corners','Disinfect TV remote and telephone','Ironing board and iron status check','Clean curtains check','Shower mold and caulk check','Maintain toilet (limescale)','Clean trash bins check'],
ft:['Depot and trolley tidy','Dust walls and panels','Check emergency exits (tidy, remove trash)'],
log:[],notes:[],amber:30,red:60}}
try{S=JSON.parse(localStorage.getItem(K))}catch(e){}
if(!S||!S.rooms)S=def();
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const isF=l=>S.floors.includes(l);
const tasks=l=>isF(l)?S.ft:S.rt;
const last=()=>{const m={};S.log.forEach(e=>{const k=e.l+'|'+e.k;if(!m[k]||e.t>m[k])m[k]=e.t});return m};
const cls=a=>a>=S.red?'r':a>=S.amber?'a':'g';
const nn=l=>S.notes.filter(n=>n.l===l&&!n.d).length;
function sum(l,m){let old=-1,nev=0;tasks(l).forEach(k=>{const t=m[l+'|'+k];if(t==null)nev++;else old=Math.max(old,ago(t))});return{old,nev}}
const badge=a=>a==null||a<0?'<span class="bd n">New</span>':'<span class="bd '+cls(a)+'">'+a+'d</span>';
const chips=(list,cur,fn)=>'<div class="chips">'+list.map(([k,t])=>'<button class="chip '+(k===cur?'on':'')+'" onclick="'+fn+'(\''+k+'\')">'+t+'</button>').join('')+'</div>';
const hdr=t=>'<header>'+t+'</header>';
function render(){
const m=last();let h='';
if(V.v==='home'){
h+=hdr('Rooms')+chips([['age','Oldest first'],['num','By number'],['nt','Has notes']],V.sort,'sortTo');
let ls=S.rooms.slice();const info={};[...S.floors,...ls].forEach(l=>info[l]=sum(l,m));
const key=l=>info[l].old+(info[l].nev?9999:0);
if(V.sort==='nt')ls=ls.filter(l=>nn(l));
if(V.sort==='age')ls.sort((a,b)=>key(b)-key(a)||(a<b?-1:1));
[...S.floors,...ls].forEach(l=>{const i=info[l],c=nn(l);
const sub=i.nev?i.nev+' never done'+(i.old>=0?', oldest '+i.old+'d':''):'Oldest: '+i.old+' days';
h+='<div class="row '+(isF(l)?'pin':'')+'" data-l="'+esc(l)+'" onclick="openL(this.dataset.l)"><div class="sp"><b>'+esc(l)+'</b><div class="sub">'+sub+'</div></div>'+(c?'<span class="sub">'+c+(c>1?' notes':' note')+'</span>':'')+badge(i.old)+'</div>'});
if(V.sort==='nt'&&!ls.length)h+='<div class="pad sub">No rooms with open notes.</div>';
}else if(V.v==='room'){
const l=V.l,ts=tasks(l);
h+='<header><button class="chip" onclick="go(\'home\')">Back</button>'+esc(l)+'</header>';
S.notes.filter(n=>n.l===l&&!n.d).forEach(n=>{h+='<div class="note"><div class="sp">'+esc(n.x)+'<div class="sub">'+fd(n.t)+'</div></div><button class="btn u" onclick="rn('+n.id+')">Resolve</button></div>'});
h+='<div class="pad" style="display:flex;gap:8px"><input id="nt" placeholder="Add a note" maxlength="200"><button class="btn" onclick="addN()">Add</button></div>';
ts.forEach((k,i)=>{const t=m[l+'|'+k],a=t==null?null:ago(t);
h+='<div class="row"><div class="sp">'+esc(k)+'<div class="sub">'+(a==null?'Never done':a===0?'Done today, '+ftm(t):'Last done '+a+(a==1?' day':' days')+' ago')+' · <span class="lk" onclick="tx('+i+')">Set date</span></div></div>'+badge(a)+'<button class="btn '+(a===0?'u':'')+'" onclick="'+(a===0?'un':'dn')+'('+i+')">'+(a===0?'Undo':'Done')+'</button></div>';
if(V.x===i)h+='<div class="pad pin"><label style="margin-top:0">Date completed</label><input type="date" max="'+fd(Date.now())+'" onchange="bd('+i+',this.value)"></div>'});
}else if(V.v==='notes'){
h+=hdr('Notes')+chips([['open','Open'],['done','Resolved'],['all','All']],V.nf,'nfTo');
const ns=S.notes.filter(n=>V.nf==='all'||(V.nf==='open')===!n.d).sort((a,b)=>b.t-a.t);
ns.forEach(n=>{h+='<div class="note"><div class="sp"><b>'+esc(n.l)+'</b> <span class="sub">'+fd(n.t)+'</span><div>'+esc(n.x)+'</div></div><button class="btn u" onclick="rn('+n.id+')">'+(n.d?'Reopen':'Resolve')+'</button></div>'});
if(!ns.length)h+='<div class="pad sub">No notes here.</div>';
}else{
h+=hdr('Settings')+'<div class="pad"><label style="margin-top:0">Room tasks (one per line)</label><textarea id="s1">'+esc(S.rt.join('\n'))+'</textarea><label>Floor tasks (one per line)</label><textarea id="s2">'+esc(S.ft.join('\n'))+'</textarea><label>Rooms (separated by spaces or commas)</label><textarea id="s3">'+esc(S.rooms.join(' '))+'</textarea><label>Amber after (days)</label><input id="s4" type="number" min="1" value="'+S.amber+'"><label>Red after (days)</label><input id="s5" type="number" min="1" value="'+S.red+'">'
+'<p class="sub">Tasks are matched by name. Renaming a task starts its history fresh, but old completions stay in the export.</p><button class="btn" onclick="sv()">Save settings</button> <span class="sub">'+esc(V.msg)+'</span>'
+'<p style="margin-top:24px"><b>Export</b><br><span class="sub">'+S.log.length+' completions and '+S.notes.length+' notes stored on this device.</span></p>'
+'<button class="btn" onclick="ex()">Export CSV</button></div>';
}
h+='<nav>'+[['home','Rooms'],['notes','Notes'],['set','Settings']].map(([k,t])=>'<button class="'+((V.v===k||(k==='home'&&V.v==='room')||(k==='set'&&V.v==='settings'))?'on':'')+'" onclick="go(\''+(k==='set'?'settings':k)+'\')">'+t+'</button>').join('')+'</nav>';
$('app').innerHTML=h}
function go(v){V.v=v;V.x=null;V.msg='';render();scrollTo(0,0)}
function openL(l){V.l=l;go('room')}
function sortTo(s){V.sort=s;render()}
function nfTo(s){V.nf=s;render()}
function dn(i){S.log.push({l:V.l,k:tasks(V.l)[i],t:Date.now()});save();render()}
function un(i){const k=tasks(V.l)[i];let b=-1;S.log.forEach((e,j)=>{if(e.l===V.l&&e.k===k&&ago(e.t)===0&&(b<0||e.t>S.log[b].t))b=j});if(b>=0)S.log.splice(b,1);save();render()}
function tx(i){V.x=V.x===i?null:i;render()}
function bd(i,v){if(!v)return;const[y,mo,d]=v.split('-').map(Number);S.log.push({l:V.l,k:tasks(V.l)[i],t:new Date(y,mo-1,d,12).getTime()});V.x=null;save();render()}
function addN(){const x=$('nt').value.trim();if(!x)return;S.notes.push({id:Date.now(),l:V.l,x,t:Date.now(),d:0});save();render()}
function rn(id){const n=S.notes.find(n=>n.id===id);if(n)n.d=n.d?0:1;save();render()}
function sv(){const ln=s=>$(s).value.split('\n').map(x=>x.trim()).filter(Boolean);
const rt=ln('s1'),ft=ln('s2'),rooms=$('s3').value.split(/[\s,]+/).filter(Boolean);
let am=parseInt($('s4').value),rd=parseInt($('s5').value);
if(!rt.length||!rooms.length||!(am>0)||!(rd>0)){V.msg='Check the fields.';render();return}
S.rt=rt;S.ft=ft;S.rooms=rooms;S.amber=am;S.red=Math.max(rd,am);save();V.msg='Saved.';render()}
async function ex(){const q=s=>'"'+String(s).replace(/"/g,'""')+'"';
const rows=[['type','location','task','date','time','text','status']];
S.log.forEach(e=>rows.push(['done',e.l,e.k,fd(e.t),ftm(e.t),'','']));
S.notes.forEach(n=>rows.push(['note',n.l,'',fd(n.t),ftm(n.t),n.x,n.d?'resolved':'open']));
try{const csv=rows.map(r=>r.map(q).join(',')).join('\n'),a=document.createElement('a');
a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='room-tracker-'+fd(Date.now())+'.csv';
document.body.appendChild(a);a.click();a.remove();V.msg='Exported.'}catch(e){V.msg='Export failed.'}render()}
render();
</script></body></html>
